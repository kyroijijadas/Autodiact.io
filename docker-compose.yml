services:
  # 1. Your Express API
  backend:
    build: ./Backend
    ports:
      - "3000:3000"
    volumes:
      # Syncs your local VS Code files to the container for hot-reloading
      - ./Backend:/app
      - /app/node_modules
    depends_on:
      - db

  # 2. The MySQL Database
  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: AutodidactIo
    volumes:
      - db_data:/var/lib/mysql

  # 3. Adminer (Your new phpMyAdmin replacement)
  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data: